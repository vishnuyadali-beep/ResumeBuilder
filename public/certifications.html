        </div>
    </nav>

    <main class="container py-4">
        <div class="row g-4">

            <!-- Add / Edit Cert Form -->
            <div class="col-lg-4">
                <div class="card shadow-sm">
                    <div class="card-header">
                        <h5 class="mb-0" id="hCertFormTitle">Add a Certification</h5>
                    </div>
                    <div class="card-body">
                        <form id="frmCert" novalidate>
                            <div class="mb-3">
                                <label for="inpCertName" class="form-label">Certification Name <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="inpCertName" aria-label="Certification name" placeholder="e.g. AWS Solutions Architect" required>
                            </div>
                            <div class="mb-3">
                                <label for="inpCertIssuer" class="form-label">Issuing Organization</label>
                                <input type="text" class="form-control" id="inpCertIssuer" aria-label="Issuing organization" placeholder="e.g. Amazon Web Services">
                            </div>
                            <div class="mb-3">
                                <label for="inpCertYear" class="form-label">Year Obtained</label>
                                <input type="number" class="form-control" id="inpCertYear" aria-label="Year obtained" placeholder="e.g. 2024" min="1950" max="2099">
                            </div>
                            <div id="divCertAlert" class="alert d-none" role="alert"></div>
                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary" id="btnSaveCert">Add Certification</button>
                                <button type="button" class="btn btn-secondary d-none" id="btnCancelCertEdit">Cancel</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Cert List -->
            <div class="col-lg-8">
                <div class="card shadow-sm">
                    <div class="card-header">
                        <h5 class="mb-0">My Certifications</h5>
                    </div>
                    <div class="card-body p-0">
                        <ul id="ulCertList" class="list-group list-group-flush" aria-label="Certifications list"></ul>
                        <p id="pNoCerts" class="text-center text-muted py-4 d-none">No certifications yet. Add your first one!</p>
                    </div>
                </div>
            </div>

        </div>
