    <main class="container py-4">
        <div class="row g-4">

            <!-- Add / Edit Award Form -->
            <div class="col-lg-4">
                <div class="card shadow-sm">
                    <div class="card-header">
                        <h5 class="mb-0" id="hAwardFormTitle">Add an Award</h5>
                    </div>
                    <div class="card-body">
                        <form id="frmAward" novalidate>
                            <div class="mb-3">
                                <label for="inpAwardName" class="form-label">Award Name <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="inpAwardName" aria-label="Award name" placeholder="e.g. Employee of the Year" required>
                            </div>
                            <div class="mb-3">
                                <label for="txaAwardDescription" class="form-label">Description</label>
                                <textarea class="form-control" id="txaAwardDescription" rows="3" aria-label="Award description" placeholder="Briefly describe the award..."></textarea>
                            </div>
                            <div class="mb-3">
                                <label for="inpAwardYear" class="form-label">Year</label>
                                <input type="number" class="form-control" id="inpAwardYear" aria-label="Year received" placeholder="e.g. 2023" min="1950" max="2099">
                            </div>
                            <div id="divAwardAlert" class="alert d-none" role="alert"></div>
                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary" id="btnSaveAward">Add Award</button>
                                <button type="button" class="btn btn-secondary d-none" id="btnCancelAwardEdit">Cancel</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Award List -->
            <div class="col-lg-8">
                <div class="card shadow-sm">
                    <div class="card-header">
                        <h5 class="mb-0">My Awards</h5>
                    </div>
                    <div class="card-body p-0">
                        <ul id="ulAwardList" class="list-group list-group-flush" aria-label="Awards list"></ul>
                        <p id="pNoAwards" class="text-center text-muted py-4 d-none">No awards yet. Add your first one!</p>
                    </div>
                </div>
            </div>

        </div>
